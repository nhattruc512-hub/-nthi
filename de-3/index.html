<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đề 3 - YHCT trắc nghiệm</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:#f5f7fb;color:#172033}header{background:#fff;border-bottom:1px solid #e5e7eb;position:sticky;top:0;z-index:5}.head{max-width:1180px;margin:auto;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}.wrap{max-width:1180px;margin:20px auto;padding:0 16px;display:grid;grid-template-columns:260px 1fr;gap:18px}.side,.main{background:#fff;border:1px solid #e5e7eb;border-radius:18px}.side{padding:14px;height:calc(100vh - 95px);position:sticky;top:78px;overflow:auto}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.qb{border:1px solid #dbe2ea;background:#fff;border-radius:9px;padding:8px 2px;font-weight:700;cursor:pointer}.qb.ok{background:#dcfce7}.qb.bad{background:#fee2e2}.qb.on{outline:2px solid #2563eb}.main{padding:24px}.topic{color:#2563eb;font-size:13px;font-weight:800}.q{font-size:22px;font-weight:800;line-height:1.5;margin:14px 0 20px}.opts{display:grid;gap:11px}.opt{border:1px solid #cbd5e1;background:#fff;border-radius:13px;padding:14px 16px;text-align:left;font-size:16px;cursor:pointer}.opt.correct{background:#dcfce7;border-color:#22c55e}.opt.wrong{background:#fee2e2;border-color:#ef4444}.fb{display:none;margin-top:16px;padding:14px;border-radius:12px;background:#eff6ff}.fb.show{display:block}.nav{display:flex;justify-content:space-between;margin-top:24px}.nav button{border:0;border-radius:11px;padding:11px 15px;font-weight:800;cursor:pointer}.next{background:#2563eb;color:#fff}.progress{font-size:13px;color:#64748b;margin-bottom:12px}a{color:#2563eb;text-decoration:none;font-weight:800}@media(max-width:760px){.wrap{grid-template-columns:1fr}.side{position:static;height:auto}.grid{grid-template-columns:repeat(10,1fr)}.q{font-size:19px}}</style></head><body><header><div class="head"><div><b>📗 Đề 3 — Y học cổ truyền</b><div style="font-size:12px;color:#64748b">115 câu trắc nghiệm • 1 đúng + 3 đáp án nhiễu</div></div><a href="../">← Danh sách đề</a></div></header><div class="wrap"><aside class="side"><div class="progress" id="prog">Đang tải...</div><div class="grid" id="grid"></div></aside><main class="main"><div class="topic" id="topic"></div><div class="q" id="q">Đang tạo đề...</div><div class="opts" id="opts"></div><div class="fb" id="fb"></div><div class="nav"><button id="prev">← Câu trước</button><button class="next" id="next">Câu tiếp →</button></div></main></div><script>let DATA=[],idx=+(localStorage.de3_idx||0),saved=JSON.parse(localStorage.de3_answers||'{}');const $=s=>document.querySelector(s);function hash(s){let h=2166136261;for(let c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}function make(raw){let groups={};raw.forEach(x=>(groups[x.topic]??=[]).push(x.answer));return raw.map(x=>{let pool=[...new Set(groups[x.topic])].filter(a=>a.toLowerCase()!=x.answer.toLowerCase());if(pool.length<3)pool.push(...[...new Set(raw.map(z=>z.answer))].filter(a=>a.toLowerCase()!=x.answer.toLowerCase()&&!pool.includes(a)));let seed=hash(x.question),wrong=[];while(wrong.length<3){seed=(seed*1664525+1013904223)>>>0;let a=pool[seed%pool.length];if(!wrong.includes(a))wrong.push(a)}let o=[x.answer,...wrong];for(let i=o.length-1;i>0;i--){seed=(seed*1664525+1013904223)>>>0;let j=seed%(i+1);[o[i],o[j]]=[o[j],o[i]]}return{id:x.id,question:x.question,topic:x.topic,options:o,correct:o.indexOf(x.answer)}})}function save(){localStorage.de3_answers=JSON.stringify(saved);localStorage.de3_idx=idx}function drawGrid(){grid.innerHTML='';DATA.forEach((x,i)=>{let b=document.createElement('button'),v=saved[x.id];b.className='qb'+(v!==undefined?(v===x.correct?' ok':' bad'):'')+(i===idx?' on':'');b.textContent=x.id;b.onclick=()=>{idx=i;render()};grid.appendChild(b)});let done=Object.keys(saved).length,ok=DATA.filter(x=>saved[x.id]===x.correct).length;prog.textContent=`Đã làm ${done}/${DATA.length} • Đúng ${ok}`}function render(){if(!DATA.length)return;let x=DATA[idx];topic.textContent=x.topic;q.textContent=`Câu ${x.id}. ${x.question}`;opts.innerHTML='';x.options.forEach((t,i)=>{let b=document.createElement('button');b.className='opt';b.innerHTML=`<b>${String.fromCharCode(65+i)}.</b> ${t}`;if(saved[x.id]!==undefined){if(i===x.correct)b.classList.add('correct');else if(i===saved[x.id])b.classList.add('wrong')}b.onclick=()=>{if(saved[x.id]===undefined){saved[x.id]=i;save();render()}};opts.appendChild(b)});if(saved[x.id]!==undefined){fb.className='fb show';fb.innerHTML=(saved[x.id]===x.correct?'✅ <b>Chính xác.</b> ':'❌ <b>Chưa đúng.</b> ')+`Đáp án: <b>${String.fromCharCode(65+x.correct)}. ${x.options[x.correct]}</b>`}else{fb.className='fb';fb.innerHTML=''}drawGrid();save()}prev.onclick=()=>{if(idx>0){idx--;render()}};next.onclick=()=>{if(idx<DATA.length-1){idx++;render()}};fetch('../de-2/index.html').then(r=>r.text()).then(t=>{let m=t.match(/const DATA=(\[.*?\]);let idx=/s);if(!m)throw Error('Không đọc được dữ liệu Đề 2');DATA=make(JSON.parse(m[1]));if(idx>=DATA.length)idx=0;render()}).catch(e=>{q.textContent='Không tải được dữ liệu. Hãy tải lại trang.';console.error(e)});</script></body></html>
