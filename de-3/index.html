<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đề 3 - YHCT trắc nghiệm</title><style>:root{--line:#e2e8f0;--blue:#2563eb;--green:#16a34a;--red:#ef4444;--muted:#64748b}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:linear-gradient(135deg,#f8fafc,#edf5ff);color:#0f172a}.app{display:grid;grid-template-columns:300px 1fr;min-height:100vh}.side{background:#fffffff0;border-right:1px solid var(--line);padding:18px;position:sticky;top:0;height:100vh;overflow:auto}.logo{font-size:22px;font-weight:950}.sub{font-size:12px;color:var(--muted);margin:5px 0 16px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px}.num{font-size:24px;font-weight:950}.cap{font-size:11px;color:var(--muted)}.bar{height:9px;background:#eaf0f7;border-radius:99px;margin:12px 0;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#2563eb,#22c55e)}label{font-size:12px;font-weight:850;color:#475569;display:block;margin:12px 0 5px}select,input{width:100%;padding:10px;border:1px solid var(--line);border-radius:11px;background:#fff}.quick{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.mini,.btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 10px;font-weight:850;cursor:pointer}.mini.on{background:#2563eb;color:#fff}.qgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:12px}.qb{height:39px;border:1px solid var(--line);background:#fff;border-radius:10px;font-weight:900;cursor:pointer;position:relative}.qb.ok{background:#dcfce7;color:#166534}.qb.bad{background:#fee2e2;color:#991b1b}.qb.on{outline:2px solid #2563eb}.qb.star:after{content:'★';position:absolute;right:2px;top:0;color:#f59e0b;font-size:10px}.main{padding:22px 30px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;background:#ffffffc7;border:1px solid var(--line);border-radius:18px;padding:12px 15px;margin-bottom:18px}.topactions{display:flex;gap:7px;flex-wrap:wrap}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:26px;box-shadow:0 18px 45px #0f172a12}.qid{font-size:21px;color:#2563eb;font-weight:950}.topic{font-size:12px;color:#64748b;margin-top:5px}.q{font-size:22px;font-weight:900;line-height:1.45;margin:18px 0}.opts{display:grid;gap:11px}.opt{border:1px solid var(--line);background:#fff;border-radius:15px;padding:14px 16px;text-align:left;font-size:16px;cursor:pointer}.opt.sel{border-color:#2563eb;background:#eff6ff}.opt.correct{border-color:#22c55e;background:#dcfce7}.opt.wrong{border-color:#ef4444;background:#fee2e2}.fb{display:none;margin-top:16px;padding:15px;border-radius:14px;background:#eff6ff}.fb.show{display:block}.memo{margin-top:15px;border:1px solid #fde68a;background:#fffbeb;border-radius:14px;padding:12px}.memo textarea{width:100%;min-height:60px;border:1px solid #fcd34d;border-radius:10px;padding:9px;resize:vertical}.nav{display:flex;justify-content:space-between;margin-top:20px}.primary{background:#0f172a;color:#fff}.starOn{background:#facc15;color:#713f12}.answerOn{background:#22c55e;color:#fff}.home{color:#2563eb;text-decoration:none;font-weight:900}@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:relative;height:auto}.main{padding:15px}.qgrid{grid-template-columns:repeat(8,1fr)}.top{align-items:flex-start;flex-direction:column}.card{padding:18px}}</style></head><body><div class="app"><aside class="side"><div class="logo">📗 Đề 3 — YHCT</div><div class="sub">115 câu trắc nghiệm • thao tác kiểu Đề 1</div><div class="stats"><div class="stat"><div class="num" id="doneN">0</div><div class="cap">Đã làm</div></div><div class="stat"><div class="num" id="okN">0</div><div class="cap">Đúng</div></div><div class="stat"><div class="num" id="badN">0</div><div class="cap">Sai</div></div><div class="stat"><div class="num" id="leftN">115</div><div class="cap">Còn lại</div></div></div><div class="bar"><i id="bar" style="width:0"></i></div><label>Chuyên đề</label><select id="topicFilter"><option value="all">Tất cả chuyên đề</option></select><label>Tìm câu</label><input id="search" placeholder="Số câu hoặc từ khóa"><div class="quick"><button class="mini on" data-filter="all">Tất cả</button><button class="mini" data-filter="todo">Chưa làm</button><button class="mini" data-filter="wrong">Câu sai</button><button class="mini" data-filter="star">Đã ⭐</button></div><div class="quick"><button class="mini" id="random">🎲 Random</button><button class="mini" id="reset">↺ Reset</button></div><div class="qgrid" id="grid"></div></aside><main class="main"><div class="top"><a class="home" href="../">← Danh sách đề</a><div class="topactions"><button class="btn" id="star">☆ Gắn sao</button><button class="btn" id="showAnswer">👁 Hiện đáp án</button></div></div><section class="card"><div class="qid" id="qid">Đang tải...</div><div class="topic" id="topic"></div><div class="q" id="q"></div><div class="opts" id="opts"></div><div class="fb" id="fb"></div><div class="memo"><b>📝 Ghi chú câu này</b><textarea id="memo" placeholder="Nhập ghi chú / keyword cần nhớ..."></textarea></div><div class="nav"><button class="btn" id="prev">← Câu trước</button><button class="btn primary" id="next">Câu tiếp →</button></div></section></main></div><script>let DATA=[],idx=+(localStorage.de3_idx||0),saved=JSON.parse(localStorage.de3_answers||'{}'),stars=JSON.parse(localStorage.de3_stars||'{}'),notes=JSON.parse(localStorage.de3_notes||'{}'),filter='all',reveal=false;const $=s=>document.querySelector(s);function hash(s){let h=2166136261;for(let c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}function make(raw){let groups={};raw.forEach(x=>(groups[x.topic]??=[]).push(x.answer));return raw.map(x=>{let pool=[...new Set(groups[x.topic])].filter(a=>a.toLowerCase()!=x.answer.toLowerCase());if(pool.length<3)pool.push(...[...new Set(raw.map(z=>z.answer))].filter(a=>a.toLowerCase()!=x.answer.toLowerCase()&&!pool.includes(a)));let seed=hash(x.question),wrong=[];while(wrong.length<3&&pool.length){seed=(seed*1664525+1013904223)>>>0;let a=pool[seed%pool.length];if(a&&!wrong.includes(a))wrong.push(a)}while(wrong.length<3)wrong.push('Không phù hợp');let o=[x.answer,...wrong];for(let i=3;i>0;i--){seed=(seed*1664525+1013904223)>>>0;let j=seed%(i+1);[o[i],o[j]]=[o[j],o[i]]}return{...x,options:o,correct:o.indexOf(x.answer)}})}function save(){localStorage.de3_answers=JSON.stringify(saved);localStorage.de3_stars=JSON.stringify(stars);localStorage.de3_notes=JSON.stringify(notes);localStorage.de3_idx=idx}function visible(x){let v=saved[x.id];if(filter==='todo'&&v!==undefined)return false;if(filter==='wrong'&&(v===undefined||v===x.correct))return false;if(filter==='star'&&!stars[x.id])return false;let tf=$('#topicFilter').value;if(tf!=='all'&&x.topic!==tf)return false;let s=$('#search').value.trim().toLowerCase();if(s&&!String(x.id).includes(s)&&!x.question.toLowerCase().includes(s))return false;return true}function stats(){let done=Object.keys(saved).filter(k=>DATA.some(x=>x.id==k)).length,ok=DATA.filter(x=>saved[x.id]===x.correct).length;doneN.textContent=done;okN.textContent=ok;badN.textContent=done-ok;leftN.textContent=DATA.length-done;bar.style.width=(done/DATA.length*100)+'%'}function drawGrid(){grid.innerHTML='';DATA.filter(visible).forEach(x=>{let i=DATA.indexOf(x),v=saved[x.id],b=document.createElement('button');b.className='qb'+(v!==undefined?(v===x.correct?' ok':' bad'):'')+(i===idx?' on':'')+(stars[x.id]?' star':'');b.textContent=x.id;b.onclick=()=>{idx=i;reveal=false;render()};grid.appendChild(b)});stats()}function render(){if(!DATA.length)return;let x=DATA[idx];qid.textContent='Câu '+x.id;topic.textContent=x.topic;q.textContent=x.question;opts.innerHTML='';x.options.forEach((t,i)=>{let b=document.createElement('button');b.className='opt';b.innerHTML='<b>'+String.fromCharCode(65+i)+'.</b> '+t;let v=saved[x.id];if(v!==undefined||reveal){if(i===x.correct)b.classList.add('correct');else if(i===v)b.classList.add('wrong')}else if(i===v)b.classList.add('sel');b.onclick=()=>{if(saved[x.id]===undefined){saved[x.id]=i;save();render()}};opts.appendChild(b)});let v=saved[x.id];if(v!==undefined||reveal){fb.className='fb show';fb.innerHTML=(v===undefined?'👁 ':v===x.correct?'✅ <b>Chính xác.</b> ':'❌ <b>Chưa đúng.</b> ')+'Đáp án: <b>'+String.fromCharCode(65+x.correct)+'. '+x.options[x.correct]+'</b>'}else{fb.className='fb';fb.innerHTML=''}star.textContent=(stars[x.id]?'★ Bỏ sao':'☆ Gắn sao');star.className='btn'+(stars[x.id]?' starOn':'');showAnswer.textContent=reveal?'🙈 Ẩn đáp án':'👁 Hiện đáp án';showAnswer.className='btn'+(reveal?' answerOn':'');memo.value=notes[x.id]||'';drawGrid();save()}star.onclick=()=>{let x=DATA[idx];stars[x.id]=!stars[x.id];if(!stars[x.id])delete stars[x.id];save();render()};showAnswer.onclick=()=>{reveal=!reveal;render()};memo.oninput=()=>{notes[DATA[idx].id]=memo.value;save()};prev.onclick=()=>{if(idx>0){idx--;reveal=false;render()}};next.onclick=()=>{if(idx<DATA.length-1){idx++;reveal=false;render()}};random.onclick=()=>{let a=DATA.map((x,i)=>[x,i]).filter(([x])=>visible(x));if(a.length){idx=a[Math.floor(Math.random()*a.length)][1];reveal=false;render()}};reset.onclick=()=>{if(confirm('Xóa toàn bộ tiến độ Đề 3?')){saved={};stars={};notes={};idx=0;save();render()}};document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(z=>z.classList.toggle('on',z===b));drawGrid()});search.oninput=drawGrid;topicFilter.onchange=drawGrid;fetch('../de-2/index.html',{cache:'no-store'}).then(r=>r.text()).then(t=>{let m=t.match(/const\s+DATA\s*=\s*(\[.*?\])\s*;\s*let\s+idx/s);if(!m)throw Error('data');DATA=make(JSON.parse(m[1]));[...new Set(DATA.map(x=>x.topic))].forEach(t=>{let o=document.createElement('option');o.value=o.textContent=t;topicFilter.appendChild(o)});if(idx>=DATA.length)idx=0;render()}).catch(()=>{qid.textContent='Lỗi tải dữ liệu';q.textContent='Hãy tải lại trang.'});</script></body></html>
