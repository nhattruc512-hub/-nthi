let idx=+(localStorage.getItem('de2_idx')||0);if(idx<0||idx>=DATA.length)idx=0;let saved=JSON.parse(localStorage.getItem('de2_answers')||'{}');const $=s=>document.querySelector(s),grid=$('#grid'),inp=$('#inp'),ans=$('#ans');function save(){localStorage.setItem('de2_answers',JSON.stringify(saved));localStorage.setItem('de2_idx',idx)}function renderGrid(){grid.innerHTML='';DATA.forEach((x,i)=>{let b=document.createElement('button');b.className='qbtn'+(saved[x.id]?' done':'')+(i===idx?' active':'');b.textContent=x.id;b.onclick=()=>{idx=i;render()};grid.appendChild(b)});$('#prog').textContent=`Đã trả lời ${Object.keys(saved).filter(k=>saved[k]).length}/${DATA.length} câu`}function render(){let x=DATA[idx];$('#topic').textContent=x.topic;$('#q').textContent=`Câu ${x.id}. ${x.question}`;inp.value=saved[x.id]||'';$('#anstxt').textContent=x.answer;ans.classList.remove('show');renderGrid();save()}inp.addEventListener('input',()=>{saved[DATA[idx].id]=inp.value;save();renderGrid()});$('#check').onclick=()=>ans.classList.toggle('show');$('#clear').onclick=()=>{inp.value='';delete saved[DATA[idx].id];ans.classList.remove('show');save();renderGrid()};$('#prev').onclick=()=>{if(idx>0){idx--;render()}};$('#next').onclick=()=>{if(idx<DATA.length-1){idx++;render()}};render();
</script></body></html>
